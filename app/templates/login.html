<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auratral HealthOS — Sign In</title>
  <link rel="stylesheet" href="/static/css/main.css?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Slow animated background mesh/grid */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    body.login-page {
      background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, #020617 70%);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">A</div>
    <h2>HealthOS</h2>
    <p class="login-sub">Auratral Dataspace — Hospital ERP</p>
    
    <form action="/login" method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="username" placeholder="admin@atralos.com" required autocomplete="on" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group" style="margin-top: 14px; margin-bottom: 20px;">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required style="width: 100%; box-sizing: border-box;">
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>
    
    {% if error %}
      <div class="login-error">
        {{ error }}
      </div>
    {% endif %}
    
    <div class="login-footer">Secured with AES-GCM-256 · ABDM Compliant</div>
  </div>

</body>
</html>
