<div class="glass-overlay-backdrop" @click="modalOpen = false"></div>
<div class="glass-overlay-content">
  <div class="glass-overlay-header">
    <div style="display: flex; flex-direction: column;">
      <h2>Order Laboratory Reagents</h2>
      <span style="font-size: 0.72rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;">
        Procurement & Stock Refill
      </span>
    </div>
    <button class="glass-overlay-close" @click="modalOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  
  <div class="glass-overlay-body">
    <form hx-post="/api/v1/lab/reagents/order" hx-target="#reagent-order-message" style="display: flex; flex-direction: column; gap: 14px;">
      
      <div class="form-group">
        <label style="font-size: 0.75rem; color: var(--text-2); font-weight: 600;">Select Reagent</label>
        <select name="reagent_id" required style="width: 100%; box-sizing: border-box; padding: 7px; font-size: 0.8rem; margin-top: 4px;">
          <option value="">-- Select Reagent to Order --</option>
          {% for r in reagents %}
            <option value="{{ r.id }}">{{ r.name }} (Current Stock: {{ r.stock }} kits)</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid-2" style="gap: 12px;">
        <div class="form-group">
          <label style="font-size: 0.75rem; color: var(--text-2); font-weight: 600;">Reorder Quantity (Kits / Vials)</label>
          <input type="number" name="quantity" min="1" value="10" required style="width: 100%; box-sizing: border-box; padding: 7px; font-size: 0.8rem; margin-top: 4px;">
        </div>
        <div class="form-group">
          <label style="font-size: 0.75rem; color: var(--text-2); font-weight: 600;">Authorized Supplier / Vendor</label>
          <input type="text" name="supplier" value="Sigma-Aldrich Diagnostics" required placeholder="e.g. Bio-Rad Laboratories..." style="width: 100%; box-sizing: border-box; padding: 7px; font-size: 0.8rem; margin-top: 4px;">
        </div>
      </div>

      <div id="reagent-order-message"></div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 12px;">
        <button type="button" @click="modalOpen = false" class="glass-btn" style="padding: 7px 16px; font-size: 0.8rem;">Cancel</button>
        <button type="submit" class="glass-btn glass-btn-primary" style="padding: 7px 20px; font-size: 0.8rem;">Submit Purchase Order</button>
      </div>
    </form>
  </div>
</div>
