<div class="page-header" style="margin-bottom: 20px;">
  <h2>Ambulance Fleet List</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Verify active ambulance vehicles, types (ALS/BLS), and maintenance logs</p>
</div>

<div class="glass-card" style="padding: 16px;">
  <table class="data-table" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="border-bottom: 1px solid var(--border); text-align: left;">
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Vehicle ID</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Registration Num</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Type</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Status</th>
      </tr>
    </thead>
    <tbody>
      {% for v in fleet %}
        <tr style="border-bottom: 1px solid var(--border);">
          <td style="padding: 10px 12px; font-weight: 600; color: var(--primary);">{{ v.id }}</td>
          <td style="padding: 10px 12px; font-weight: 500; color: var(--text-1);">{{ v.vehicle_num }}</td>
          <td style="padding: 10px 12px; color: var(--text-2);">{{ v.type }}</td>
          <td style="padding: 10px 12px;">
            <span style="color: {% if v.status == 'Available' %}var(--success){% else %}var(--accent){% endif %}; font-weight: 600;">
              {{ v.status }}
            </span>
          </td>
        </tr>
      {% else %}
        <tr>
          <td colspan="4" style="padding: 20px; text-align: center; color: var(--text-3);">No vehicles in fleet database.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
