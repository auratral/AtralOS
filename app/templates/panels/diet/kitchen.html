<div class="page-header" style="margin-bottom: 20px;">
  <h2>Dietary Kitchen Summary</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Aggregated meal counts and allergen checklists for kitchen staff</p>
</div>

<div class="glass-card" style="padding: 20px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Kitchen Summary Sheet</h3>
  
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
    <div style="padding: 15px; background: rgba(37, 99, 235, 0.05); border: 1px solid var(--border); border-radius: var(--radius-md);">
      <div style="font-size: 0.75rem; color: var(--text-2); text-transform: uppercase;">Regular Vegetarian</div>
      <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 5px;">42 Meals</div>
    </div>
    <div style="padding: 15px; background: rgba(37, 99, 235, 0.05); border: 1px solid var(--border); border-radius: var(--radius-md);">
      <div style="font-size: 0.75rem; color: var(--text-2); text-transform: uppercase;">Diabetic Diet</div>
      <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 5px;">28 Meals</div>
    </div>
    <div style="padding: 15px; background: rgba(37, 99, 235, 0.05); border: 1px solid var(--border); border-radius: var(--radius-md);">
      <div style="font-size: 0.75rem; color: var(--text-2); text-transform: uppercase;">Salt Restricted</div>
      <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 5px;">15 Meals</div>
    </div>
  </div>
</div>
