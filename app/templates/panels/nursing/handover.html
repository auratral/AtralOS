<div class="page-header" style="margin-bottom: 20px;">
  <h2>Nursing Shift Handover</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Log nurse shift handovers and coordinate care continuity</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Log New Shift Handover</h3>
  
  <form hx-post="/api/v1/nursing/handover" hx-target="#handover-message" hx-swap="innerHTML">
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>Outgoing Nurse *</label>
        <input type="text" name="outgoing" required placeholder="Sr. Mary D'Souza" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group">
        <label>Incoming Nurse *</label>
        <input type="text" name="incoming" required placeholder="Sr. Linda Chen" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>Shift Type</label>
        <select name="shift_type" style="width: 100%; box-sizing: border-box;">
          <option>Morning (07:00 - 15:00)</option>
          <option>Evening (15:00 - 23:00)</option>
          <option>Night (23:00 - 07:00)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Ward Name</label>
        <input type="text" name="ward" readonly value="General Ward A" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Shift Handover Summary & Critical Notes *</label>
      <textarea name="summary" required placeholder="Bed 3: post-op monitoring, Bed 8: IV fluids schedule, Bed 12: blood sugar checks..." style="width: 100%; height: 120px; box-sizing: border-box;"></textarea>
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Save Shift Handover</button>
  </form>
  
  <div id="handover-message"></div>
</div>
