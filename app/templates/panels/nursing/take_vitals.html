<div class="page-header" style="margin-bottom: 20px;">
  <div style="display: flex; flex-direction: column;">
    <h2 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; color: var(--text-1); margin: 0;">Vitals & Clinical Intake</h2>
    <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Capture vitals for <strong>{{ patient.name }}</strong> (UHID: <span style="font-family: monospace;">{{ patient.id }}</span>)</p>
  </div>
</div>

<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Intake Assessment Form</h3>
  
  <form hx-post="/api/v1/nursing/save-vitals" hx-target="#vitals-save-message" hx-swap="innerHTML">
    <input type="hidden" name="appt_id" value="{{ appt_id }}">
    <input type="hidden" name="patient_id" value="{{ patient.id }}">
    
    <div class="grid-2">
      <div class="form-group">
        <label>Blood Pressure (mmHg) *</label>
        <input type="text" name="bp" required placeholder="e.g. 120/80" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group">
        <label>Temperature (°F) *</label>
        <input type="text" name="temp" required placeholder="e.g. 98.6" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div class="grid-2" style="margin-top: 12px;">
      <div class="form-group">
        <label>Pulse / Heart Rate (bpm) *</label>
        <input type="number" name="pulse" required placeholder="e.g. 72" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group">
        <label>SpO2 / Oxygen Saturation (%) *</label>
        <input type="number" name="spo2" required placeholder="e.g. 98" min="0" max="100" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div class="grid-2" style="margin-top: 12px;">
      <div class="form-group">
        <label>Random Blood Sugar (mg/dL)</label>
        <input type="number" name="sugar" placeholder="e.g. 110" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group">
        <label>Respiratory Rate (breaths/min)</label>
        <input type="number" name="resp_rate" placeholder="e.g. 16" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>

    <div class="grid-2" style="margin-top: 12px;">
      <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" id="vitals-height" name="height" placeholder="e.g. 170" style="width: 100%; box-sizing: border-box;" oninput="calcBMI()">
      </div>
      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" id="vitals-weight" name="weight" placeholder="e.g. 70" style="width: 100%; box-sizing: border-box;" oninput="calcBMI()">
      </div>
    </div>

    <div class="form-group" style="margin-top: 12px;">
      <label>Calculated Body Mass Index (BMI)</label>
      <input type="text" id="vitals-bmi" readonly placeholder="Auto-calculated" style="width: 100%; box-sizing: border-box; background: var(--bg); font-weight: 600;">
    </div>
    
    <div class="form-group" style="margin-top: 12px;">
      <label>Clinical Notes / Chief Complaints</label>
      <textarea name="notes" placeholder="Patient reports mild headache and fatigue since yesterday..." style="width: 100%; box-sizing: border-box; min-height: 80px;"></textarea>
    </div>
    
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <button type="button" class="glass-btn glass-btn-secondary" style="flex: 1;"
              hx-get="/dashboard/panel?role=nursing&panel=queue" hx-target="#main-panel-content">
        Cancel & Back
      </button>
      <button type="submit" class="glass-btn glass-btn-primary" style="flex: 1;">
        Send to Doctor
      </button>
    </div>
  </form>
  
  <div id="vitals-save-message" style="margin-top: 12px;"></div>
</div>

<script>
function calcBMI() {
  const h = parseFloat(document.getElementById('vitals-height').value) / 100;
  const w = parseFloat(document.getElementById('vitals-weight').value);
  if (h > 0 && w > 0) {
    const bmi = (w / (h * h)).toFixed(1);
    document.getElementById('vitals-bmi').value = bmi;
  } else {
    document.getElementById('vitals-bmi').value = '';
  }
}
</script>
