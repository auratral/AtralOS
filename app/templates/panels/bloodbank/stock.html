<div class="page-header" style="margin-bottom: 20px;">
  <h2>Blood Bank Stock Inventory</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Live inventory levels of matched whole blood and separated components</p>
</div>

<div class="glass-card" style="padding: 16px;">
  <table class="data-table" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="border-bottom: 1px solid var(--border); text-align: left;">
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Blood Group</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Component</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Available Units</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Expiry Status</th>
      </tr>
    </thead>
    <tbody>
      {% for inv in inventory %}
        <tr style="border-bottom: 1px solid var(--border);">
          <td style="padding: 10px 12px; font-weight: 700; color: var(--danger);">{{ inv.blood_group }}</td>
          <td style="padding: 10px 12px; font-weight: 500; color: var(--text-1);">{{ inv.component }}</td>
          <td style="padding: 10px 12px; font-weight: 600; color: var(--text-1);">{{ inv.units }} Units</td>
          <td style="padding: 10px 12px; color: var(--text-2);">{{ inv.expiry }}</td>
        </tr>
      {% else %}
        <tr>
          <td colspan="4" style="padding: 20px; text-align: center; color: var(--text-3);">Inventory empty.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
