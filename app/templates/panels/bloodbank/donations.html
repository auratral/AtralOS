<div class="page-header" style="margin-bottom: 20px;">
  <h2>Blood Donations Register</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Record voluntary blood donations, screen donor histories, and log unit packaging</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Log New Donation</h3>
  
  <form hx-post="/api/v1/bloodbank/donations" hx-target="#donations-message" hx-swap="innerHTML">
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Donor Full Name *</label>
      <input type="text" name="donor_name" required placeholder="Amit Sharma" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>Blood Group *</label>
        <select name="blood_group" style="width: 100%; box-sizing: border-box;">
          <option>O+</option>
          <option>O-</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
        </select>
      </div>
      <div class="form-group">
        <label>Volume Donated (ml) *</label>
        <input type="number" name="volume" required value="350" min="100" max="600" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Hemoglobin Level (g/dL) *</label>
      <input type="number" step="0.1" name="hb_level" required value="14.5" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Log Blood Donation</button>
  </form>
  
  <div id="donations-message"></div>
</div>
