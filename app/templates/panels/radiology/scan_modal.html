<div class="glass-overlay-backdrop" @click="modalOpen = false"></div>
<div class="glass-overlay-content">
  <div class="glass-overlay-header">
    <div style="display: flex; flex-direction: column;">
      <h2>Upload Radiology Report</h2>
      <span style="font-size: 0.72rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;">
        RIS Scan & PACS Integration
      </span>
    </div>
    <button class="glass-overlay-close" @click="modalOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  
  <div class="glass-overlay-body">
    <!-- enctype="multipart/form-data" ensures browser submits actual files -->
    <form hx-post="/api/v1/radiology/save-scan/{{ inv.id }}" hx-encoding="multipart/form-data" hx-target="#radio-modal-message" style="display: flex; flex-direction: column; gap: 14px;">
      <div style="background: rgba(163,177,198,0.08); padding: 12px; border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-2); line-height: 1.5; border: 1px solid var(--border);">
        <strong>Patient Name:</strong> <span style="color: var(--text-1); font-weight: 600;">{{ patient_name }}</span><br/>
        <strong>Scan Requested:</strong> <span style="color: var(--primary); font-weight: 600;">{{ inv.test_name }}</span>
      </div>

      <div class="form-group">
        <label style="font-size: 0.75rem; color: var(--text-2); font-weight: 600;">Radiologist's Findings / Diagnosis Report</label>
        <textarea name="findings" required placeholder="Describe scan observations (e.g. Lungs are clear, no focal consolidation, cardiac size normal...)" style="width: 100%; box-sizing: border-box; min-height: 100px; margin-top: 4px; font-size: 0.8rem; padding: 7px;"></textarea>
      </div>

      <div class="form-group">
        <label style="font-size: 0.75rem; color: var(--text-2); font-weight: 600;">Upload Patient Scan (DICOM / JPEG / PDF)</label>
        <div style="margin-top: 6px; border: 2px dashed var(--border); padding: 24px; border-radius: var(--radius-md); text-align: center; background: rgba(163,177,198,0.02); transition: border-color 0.3s;"
             onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
          <input type="file" name="scan_file" id="scan-file-input" style="display: none;"
                 onchange="document.getElementById('scan-file-name').innerText = this.files[0] ? '✓ Selected: ' + this.files[0].name : '';">
          <div style="font-size: 1.6rem; margin-bottom: 6px;">📷</div>
          <button type="button" class="glass-btn" onclick="document.getElementById('scan-file-input').click();" style="font-size: 0.78rem; padding: 5px 12px; font-weight: 600;">
            Choose DICOM / Image Scan
          </button>
          <div id="scan-file-name" style="margin-top: 8px; font-size: 0.75rem; color: var(--primary); font-weight: 600;"></div>
        </div>
      </div>

      <div id="radio-modal-message"></div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 12px;">
        <button type="button" @click="modalOpen = false" class="glass-btn" style="padding: 7px 16px; font-size: 0.8rem;">Cancel</button>
        <button type="submit" class="glass-btn glass-btn-primary" style="padding: 7px 20px; font-size: 0.8rem;">Save & Upload Report</button>
      </div>
    </form>
  </div>
</div>
