<div class="page-header" style="margin-bottom: 24px;">
  <h2>New Patient Intake</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Register new outpatients and link ABDM / ABHA accounts</p>
</div>

<div class="workspace-grid">
  
  <!-- Left Registration Card -->
  <div class="glass-card">
    <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Registration Form</h3>
    
    <form hx-post="/api/v1/patients/register_form" hx-target="#register-message" hx-swap="innerHTML">
      <div style="text-align:center; margin-bottom: 16px;">
        <div class="photo-placeholder" id="patient-photo-preview" style="width: 80px; height: 80px;">
          📷
        </div>
        <div style="font-size: .65rem; color: var(--text-3); margin-top: 6px;">Webcam Intake Stream</div>
      </div>
      
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" name="name" required placeholder="Rajesh Kumar" style="width: 100%; box-sizing: border-box;">
      </div>
      
      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>Date of Birth *</label>
          <input type="date" name="dob" required style="width: 100%; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label>Gender *</label>
          <select name="gender" style="width: 100%; box-sizing: border-box;">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>National ID Type</label>
          <select name="national_id_type" style="width: 100%; box-sizing: border-box;">
            <option value="">Select ID Type</option>
            <option>Aadhaar Card</option>
            <option>PAN Card</option>
            <option>Passport</option>
            <option>Voter ID</option>
            <option>Driving License</option>
          </select>
        </div>
        <div class="form-group">
          <label>National ID Number</label>
          <input type="text" name="national_id_number" placeholder="XXXX-XXXX-XXXX" style="width: 100%; box-sizing: border-box;">
        </div>
      </div>
      
      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>Mobile Number *</label>
          <input type="tel" name="mobile" required placeholder="9876543210" style="width: 100%; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label>Blood Group</label>
          <select name="blood_group" style="width: 100%; box-sizing: border-box;">
            <option value="">Select</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>O+</option>
            <option>O-</option>
            <option>AB+</option>
            <option>AB-</option>
          </select>
        </div>
      </div>

      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="rajesh@example.com" style="width: 100%; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label>Alternative Mobile Number</label>
          <input type="tel" name="alt_mobile" placeholder="9876543211" style="width: 100%; box-sizing: border-box;">
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label>Address</label>
        <input type="text" name="address" placeholder="Street, City, State - PIN" style="width: 100%; box-sizing: border-box;">
      </div>
      
      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>Occupation</label>
          <input type="text" name="occupation" placeholder="e.g. Engineer" style="width: 100%; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label>Marital Status</label>
          <select name="marital_status" style="width: 100%; box-sizing: border-box;">
            <option>Single</option>
            <option>Married</option>
            <option>Widowed</option>
            <option>Divorced</option>
          </select>
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label>Known Allergies</label>
        <input type="text" name="allergies" placeholder="e.g. Penicillin, Dust" style="width: 100%; box-sizing: border-box;">
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label>Chronic Conditions</label>
        <input type="text" name="chronic_conditions" placeholder="e.g. Diabetes, Hypertension" style="width: 100%; box-sizing: border-box;">
      </div>
      
      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>Emergency Contact *</label>
          <input type="text" name="emergency" required placeholder="Guardian Name - Mobile" style="width: 100%; box-sizing: border-box;">
        </div>
        <div class="form-group">
          <label>Emergency Relationship *</label>
          <select name="emergency_relationship" style="width: 100%; box-sizing: border-box;" required>
            <option>Spouse</option>
            <option>Father</option>
            <option>Mother</option>
            <option>Guardian</option>
            <option>Child</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      
      <div class="grid-2" style="margin-top: 12px;">
        <div class="form-group">
          <label>Billing Category *</label>
          <select name="billing_category" style="width: 100%; box-sizing: border-box;" required>
            <option>Private Pay</option>
            <option>Insurance / TPA</option>
            <option>Government Scheme (CGHS/ECHS)</option>
            <option>Corporate Pay</option>
          </select>
        </div>
        <div class="form-group">
          <label>Insurance Details (TPA - Policy)</label>
          <input type="text" name="insurance" placeholder="Star Health - POL100329" style="width: 100%; box-sizing: border-box;">
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 12px;">
        <label>Referred By</label>
        <input type="text" name="referred_by" placeholder="Dr. Name / Self" style="width: 100%; box-sizing: border-box;">
      </div>
      
      <!-- ABHA Verification -->
      <div style="background: rgba(6, 182, 212, 0.05); padding: 12px; border-radius: var(--radius-md); border: 1px dashed rgba(6, 182, 212, 0.3); margin-top: 16px; margin-bottom: 16px;">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--accent); display: block; margin-bottom: 6px;">ABDM / ABHA Linking</span>
        <div style="display: flex; gap: 8px;">
          <input type="text" name="abha_id" id="reg-abha-input" placeholder="Aadhaar / Mobile for ABHA" style="flex: 1; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 0.8rem; background: var(--bg); color: var(--text-1);">
          <button type="button" class="glass-btn glass-btn-primary" style="padding: 6px 14px;">Get OTP</button>
        </div>
      </div>
      
      <!-- Consents -->
      <div style="border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 16px;">
        <label style="display: flex; align-items: center; gap: 6px; font-size: 0.75rem; cursor: pointer; margin-bottom: 6px; color: var(--text-2);">
          <input type="checkbox" name="consent_academic" checked value="true"> Academic research consent
        </label>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 0.75rem; cursor: pointer; color: var(--text-2);">
          <input type="checkbox" name="consent_commercial" checked value="true"> Commercial AI/ML consent
        </label>
      </div>
      
      <button type="submit" class="btn-login" style="width: 100%;">Register Patient</button>
    </form>
    
    <div id="register-message"></div>
  </div>
  
  <!-- Right Column (AI Symptom Triage) -->
  <div class="glass-card">
    <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">AI Symptom Triage</h3>
    <div class="form-group">
      <label>Patient Symptoms</label>
      <input type="text" id="symptom-input" placeholder="e.g. chest pain, shortness of breath" style="width: 100%; box-sizing: border-box;">
    </div>
    <button class="btn-login" onclick="runTriage()" style="width: 100%; margin-top: 8px;">Analyze Urgency</button>
    
    <div id="triage-output" style="margin-top: 15px; display: none; padding: 12px; border-radius: var(--radius-md); font-size: 0.8rem; line-height: 1.4;"></div>
  </div>

</div>

<script>
function runTriage() {
  const sym = document.getElementById('symptom-input').value;
  const out = document.getElementById('triage-output');
  if(!sym) return;
  out.style.display = 'block';
  
  if (sym.toLowerCase().includes('chest') || sym.toLowerCase().includes('heart') || sym.toLowerCase().includes('breath')) {
    out.style.background = 'rgba(239, 68, 68, 0.1)';
    out.style.color = 'var(--danger)';
    out.style.border = '1px solid var(--danger)';
    out.innerHTML = '🚨 <strong>EMERGENCY TRIAGE: RED</strong><br/>Immediate transfer to Emergency/Trauma. Suspected Acute Cardiac Event.';
  } else {
    out.style.background = 'rgba(16, 185, 129, 0.1)';
    out.style.color = 'var(--success)';
    out.style.border = '1px solid var(--success)';
    out.innerHTML = '🟢 <strong>STABLE TRIAGE: GREEN</strong><br/>Recommended Department: Clinical Outpatients.';
  }
}
</script>
