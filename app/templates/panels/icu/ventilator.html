<div class="page-header" style="margin-bottom: 20px;">
  <h2>ICU Ventilators Map</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Record ventilator mapping status, settings, and blood gas metrics</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Log Ventilator Settings</h3>
  
  <form hx-post="/api/v1/icu/ventilator" hx-target="#vent-message" hx-swap="innerHTML">
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>ICU Bed Number *</label>
      <input type="text" name="bed_number" required placeholder="Bed 3" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>Ventilation Mode *</label>
        <select name="vent_mode" style="width: 100%; box-sizing: border-box;">
          <option>AC/VC (Volume Control)</option>
          <option>AC/PC (Pressure Control)</option>
          <option>SIMV + PS</option>
          <option>CPAP / PS</option>
        </select>
      </div>
      <div class="form-group">
        <label>FiO2 (%) *</label>
        <input type="number" name="fio2" required value="40" min="21" max="100" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>PEEP (cmH2O) *</label>
        <input type="number" name="peep" required value="5" min="0" max="25" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group">
        <label>Respiratory Rate (bpm) *</label>
        <input type="number" name="rr" required value="12" min="4" max="40" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>Tidal Volume (ml)</label>
        <input type="number" name="tv" value="450" style="width: 100%; box-sizing: border-box;">
      </div>
      <div class="form-group">
        <label>Pressure Support (cmH2O)</label>
        <input type="number" name="ps" value="10" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Record Ventilator Mapping</button>
  </form>
  
  <div id="vent-message"></div>
</div>
