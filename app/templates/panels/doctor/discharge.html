<div class="page-header" style="margin-bottom: 20px;">
  <h2>Discharge Summaries</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Compile and export clinical discharge summary forms</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Generate Discharge Summary</h3>
  
  <form hx-post="/api/v1/doctor/discharge" hx-target="#discharge-message" hx-swap="innerHTML">
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Patient ID / UHID *</label>
      <input type="text" name="patient_id" required placeholder="AURA-2026-0001" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Final Diagnosis *</label>
      <input type="text" name="diagnosis" required placeholder="e.g. Acute Appendicitis (post-laparoscopic appendectomy)" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Summary of Case / Clinical Course *</label>
      <textarea name="course" required placeholder="Patient presented with right lower quadrant pain. Admitted and underwent laparoscopic appendectomy. Post-operative period uneventful..." style="width: 100%; height: 100px; box-sizing: border-box;"></textarea>
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Discharge Advice & Medications *</label>
      <textarea name="advice" required placeholder="Tab Amoxicillin 500mg TID x 5 days, Tab Paracetamol 650mg PRN for pain, wound care details, follow up in OPD in 7 days..." style="width: 100%; height: 80px; box-sizing: border-box;"></textarea>
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Generate Discharge Summary PDF</button>
  </form>
  
  <div id="discharge-message"></div>
</div>
