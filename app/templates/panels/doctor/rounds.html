<div class="page-header" style="margin-bottom: 20px;">
  <h2>IPD Rounding Workspace</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Record daily IPD clinical rounds, evaluate bed statuses, and note symptoms</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Log IPD Round Entry</h3>
  
  <form hx-post="/api/v1/doctor/rounds" hx-target="#rounds-message" hx-swap="innerHTML">
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Bed Number (Ward A / ICU) *</label>
      <input type="text" name="bed_number" required placeholder="Bed 5" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Patient ID / UHID *</label>
      <input type="text" name="patient_id" required placeholder="AURA-2026-0001" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Rounding Clinical Notes & Progress *</label>
      <textarea name="notes" required placeholder="Cardiorespiratory parameters stable, chest clear, continue current IV antibiotic regimen..." style="width: 100%; height: 100px; box-sizing: border-box;"></textarea>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px;">
      <div class="form-group">
        <label>Acuity / Priority</label>
        <select name="priority" style="width: 100%; box-sizing: border-box;">
          <option>Stable</option>
          <option>Guarded</option>
          <option>Critical</option>
        </select>
      </div>
      <div class="form-group">
        <label>Next Round Scheduled</label>
        <input type="time" name="next_round" value="18:00" style="width: 100%; box-sizing: border-box;">
      </div>
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Record Daily Round Notes</button>
  </form>
  
  <div id="rounds-message"></div>
</div>
