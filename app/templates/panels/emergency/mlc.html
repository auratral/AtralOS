<div class="page-header" style="margin-bottom: 20px;">
  <h2>Medico-Legal Case (MLC) Logs</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Secure ledger for recording police intimation and MLC records</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">New MLC Registration</h3>
  
  <form hx-post="/api/v1/emergency/mlc" hx-target="#mlc-message" hx-swap="innerHTML">
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Patient ID / UHID *</label>
      <input type="text" name="patient_id" required placeholder="AURA-2026-0001" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Police Station Intimation Copy Number *</label>
      <input type="text" name="police_copy" required placeholder="PS-MLC-2026-042" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Type of Case *</label>
      <select name="mlc_type" style="width: 100%; box-sizing: border-box;">
        <option>Road Traffic Accident (RTA)</option>
        <option>Assault / Physical Trauma</option>
        <option>Poisoning / Drug Overdose</option>
        <option>Burns / Industrial Injury</option>
      </select>
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Detailed MLC Notes & Injury Findings *</label>
      <textarea name="findings" required placeholder="Laceration of size 5x2cm over right parietal region, bruising present..." style="width: 100%; height: 80px; box-sizing: border-box;"></textarea>
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Log Medico-Legal Case</button>
  </form>
  
  <div id="mlc-message"></div>
</div>
