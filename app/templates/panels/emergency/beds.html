<div class="page-header" style="margin-bottom: 24px;">
  <h2>ER Observation Beds</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Bed map status for Emergency triage observation</p>
</div>

<div class="glass-card">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">ER Ward Beds</h3>
  
  <div class="bed-grid">
    {% for i in range(1, 9) %}
      <div class="bed-cell occupied">
        <div class="bed-number">ER-Bed {{ i }}</div>
        <div class="bed-status-label">Occupied</div>
      </div>
    {% endfor %}
  </div>
</div>
