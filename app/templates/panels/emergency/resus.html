<div class="page-header" style="margin-bottom: 20px;">
  <h2>Resuscitation Bay Logs</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Real-time resus bay occupancy and vital monitoring</p>
</div>

<div class="glass-card" style="padding: 20px; max-width: 600px;">
  <h3 class="form-title" style="margin-top: 0; margin-bottom: 15px;">Resus Intake Log</h3>
  
  <form hx-post="/api/v1/emergency/resus" hx-target="#resus-message" hx-swap="innerHTML">
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Resus Bay Number *</label>
      <select name="bay_number" style="width: 100%; box-sizing: border-box;">
        <option>Resus Bay 1</option>
        <option>Resus Bay 2</option>
        <option>Resus Bay 3</option>
      </select>
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Patient ID / Name *</label>
      <input type="text" name="patient_identifier" required placeholder="AURA-2026-0001 or Unknown Male" style="width: 100%; box-sizing: border-box;">
    </div>
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label>Trauma / Resus Interventions *</label>
      <textarea name="interventions" required placeholder="Intubated, bilateral chest tubes inserted, IV saline running, GCS 6..." style="width: 100%; height: 100px; box-sizing: border-box;"></textarea>
    </div>
    
    <button type="submit" class="btn-login" style="width: 100%;">Record Resus Entry</button>
  </form>
  
  <div id="resus-message"></div>
</div>
