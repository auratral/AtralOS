<div class="page-header" style="margin-bottom: 20px;">
  <h2>Drug Expiry Warnings</h2>
  <p style="color: var(--text-2); font-size: 0.85rem; margin: 4px 0 0 0;">Check batch expirations and prioritize stock rotation</p>
</div>

<div class="glass-card" style="padding: 16px;">
  <table class="data-table" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="border-bottom: 1px solid var(--border); text-align: left;">
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Drug Name</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Batch</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Expiry Date</th>
        <th style="padding: 8px 12px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-2); font-weight: 600;">Warning Status</th>
      </tr>
    </thead>
    <tbody>
      {% for item in drugs %}
        <tr style="border-bottom: 1px solid var(--border);">
          <td style="padding: 10px 12px; font-weight: 500; color: var(--text-1);">{{ item.name }}</td>
          <td style="padding: 10px 12px; color: var(--text-2);">{{ item.batch }}</td>
          <td style="padding: 10px 12px; font-weight: 600; color: var(--danger);">{{ item.expiry }}</td>
          <td style="padding: 10px 12px;">
            <span style="color: var(--danger); font-weight: 700;">🚨 EXPIRES SOON</span>
          </td>
        </tr>
      {% else %}
        <tr>
          <td colspan="4" style="padding: 20px; text-align: center; color: var(--text-3);">No active expiry warnings.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
